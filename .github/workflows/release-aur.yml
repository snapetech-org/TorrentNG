name: Publish AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read

jobs:
  publish-aur:
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual package publishes must be dispatched from the default main branch." >&2
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ && ! "$tag" =~ ^main-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
            [[ "$tag" == *..* ]] || ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          git fetch --force origin main --tags
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag points at $tag_commit, which is not on origin/main." >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Configure AUR SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_KEY:-}" ]]; then
            echo "AUR_SSH_KEY is not configured; skipping AUR publish."
            exit 0
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 0600 ~/.ssh/aur
          cat > ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          expected_fingerprint='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          actual_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo 'Pinned AUR host key fingerprint mismatch.' >&2
            exit 1
          }
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            StrictHostKeyChecking yes
            BatchMode yes
            PasswordAuthentication no
            ProxyCommand nc -X connect -x 10.0.2.100:3128 %h %p
          EOF
          chmod 0600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Publish torrentngd-git
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${AUR_SSH_KEY:-}" ]] || exit 0
          workdir="$(mktemp -d)"
          git clone ssh://aur@aur.archlinux.org/torrentngd-git.git "$workdir/torrentngd-git"
          cp packaging/arch/PKGBUILD "$workdir/torrentngd-git/PKGBUILD"
          cp packaging/arch/torrentngd.{service,sysusers,tmpfiles} "$workdir/torrentngd-git/"
          cp packaging/torrentngd.config.toml "$workdir/torrentngd-git/"
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$workdir/torrentngd-git:/pkg" \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed pacman-contrib
              if ! getent group "$HOST_GID" >/dev/null; then
                groupadd -g "$HOST_GID" builder
              fi
              useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              chown -R "$HOST_UID:$HOST_GID" /pkg
              su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"
            '
          git -C "$workdir/torrentngd-git" config user.name "snapetech release bot"
          git -C "$workdir/torrentngd-git" config user.email "release@snapetech.local"
          git -C "$workdir/torrentngd-git" add PKGBUILD .SRCINFO torrentngd.service torrentngd.sysusers torrentngd.tmpfiles torrentngd.config.toml
          git -C "$workdir/torrentngd-git" commit -m "Update to $RELEASE_TAG" || exit 0
          git -C "$workdir/torrentngd-git" push
