name: Backend Evidence

on:
  workflow_dispatch:
    inputs:
      run_live_fault:
        description: "Run release-daemon crash, SQLite-failure, and storage-failure matrix"
        required: true
        default: false
        type: boolean
      run_api_load:
        description: "Run API/SSE load against base_url, or an isolated local daemon when blank"
        required: true
        default: false
        type: boolean
      base_url:
        description: "Loopback target, or remote HTTPS origin listed in TNG_PROTECTED_TARGET_ALLOWED_ORIGINS"
        required: false
        default: ""
        type: string
      load_duration_seconds:
        description: "API load duration"
        required: true
        default: "60"
        type: string
      load_clients:
        description: "Concurrent JSON API clients"
        required: true
        default: "32"
        type: string
      load_sse_clients:
        description: "Concurrent deliberately slow SSE consumers"
        required: true
        default: "8"
        type: string
      run_public_compat:
        description: "Run opt-in public torrent/client compatibility evidence"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deterministic-fault:
    name: Deterministic fault matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run deterministic matrix
        run: |
          TNG_FAULT_MATRIX_STRICT=0 \
            scripts/backend_burndown_fault_matrix.sh \
            "certification/reports/backend-burndown-fault-matrix-${GITHUB_RUN_ID}.md"

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-deterministic-fault-${{ github.run_id }}
          path: |
            certification/reports/backend-burndown-fault-matrix-*
            certification/reports/backend-burndown-fault-*.log
          if-no-files-found: warn

  live-fault:
    name: Live release-daemon fault matrix
    if: github.ref == 'refs/heads/main' && inputs.run_live_fault == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build release daemon
        run: cargo build --release --locked -p torrentngd

      - name: Run live fault injection
        env:
          TNG_FAULT_TOKEN: ${{ secrets.TNG_BACKEND_API_TOKEN }}
        run: |
          TNG_FAULT_MATRIX_STRICT=1 \
            scripts/backend_burndown_native_fault_injection.sh \
            "certification/reports/backend-burndown-native-fault-${GITHUB_RUN_ID}.md"

      - name: Upload live fault evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-live-fault-${{ github.run_id }}
          path: certification/reports/backend-burndown-native-fault-*
          if-no-files-found: warn

  api-load:
    name: Live many-client and slow-SSE load
    if: github.ref == 'refs/heads/main' && inputs.run_api_load == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run API/SSE load
        env:
          TNG_BASE_URL: ${{ inputs.base_url }}
          TNG_API_TOKEN: ${{ secrets.TNG_BACKEND_API_TOKEN }}
          TNG_PROTECTED_TARGET_ALLOWED_ORIGINS: ${{ vars.TNG_PROTECTED_TARGET_ALLOWED_ORIGINS || vars.TNG_BACKEND_API_ALLOWED_ORIGINS }}
          TNG_LOAD_DURATION_SECONDS: ${{ inputs.load_duration_seconds }}
          TNG_LOAD_CLIENTS: ${{ inputs.load_clients }}
          TNG_LOAD_SSE_CLIENTS: ${{ inputs.load_sse_clients }}
          TNG_LOAD_SLOW_DELAY_MS: "250"
        run: |
          set -euo pipefail
          report="certification/reports/backend-api-load-${GITHUB_RUN_ID}.md"
          if [[ -z "${TNG_BASE_URL:-}" ]]; then
            scripts/backend_burndown_api_load_local.sh "$report"
          else
            if [[ -z "${TNG_API_TOKEN:-}" ]]; then
              echo "a configured base_url requires the TNG_BACKEND_API_TOKEN secret" >&2
              exit 1
            fi
            scripts/backend_burndown_api_load.py "$report"
          fi

      - name: Upload API/SSE evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-api-load-${{ github.run_id }}
          path: certification/reports/backend-api-load-*
          if-no-files-found: warn

  public-compatibility:
    name: API and storage compatibility contracts
    if: github.ref == 'refs/heads/main' && inputs.run_public_compat == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run repository compatibility contract matrix
        env:
          UNIVERSAL_COMPAT_LIVE: "0"
          UNIVERSAL_COMPAT_PUBLIC: "0"
        run: |
          scripts/universal_compatibility_certification.sh \
            "certification/reports/universal-compat-contracts-${GITHUB_RUN_ID}.md"

      - name: Upload compatibility contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-compat-contracts-${{ github.run_id }}
          path: certification/reports/universal-compat-contracts-${{ github.run_id }}.md*
          if-no-files-found: warn

  local-client-interop:
    name: Local/client interop (${{ matrix.suite }})
    if: github.ref == 'refs/heads/main' && inputs.run_public_compat == true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        suite: [base, extended, protocol]
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run local client interop suite
        env:
          INTEROP_LOCAL_SUITE: ${{ matrix.suite }}
          INTEROP_LOCAL_TIMEOUT_SECS: "900"
          INTEROP_EXTENDED_LOCAL: "1"
          INTEROP_PROTOCOL_LOCAL: "1"
          INTEROP_WORKDIR: ${{ runner.temp }}/torrentng-interop-${{ github.run_id }}-${{ matrix.suite }}
          INTEROP_REPORT: certification/reports/interop-matrix-${{ matrix.suite }}-${{ github.run_id }}.md
        run: scripts/interop_matrix.sh --local

      - name: Upload local client interop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-local-interop-${{ matrix.suite }}-${{ github.run_id }}
          path: certification/reports/interop-matrix-${{ matrix.suite }}-${{ github.run_id }}.md
          if-no-files-found: warn

  public-torrent-interop:
    name: Public torrent client interop
    if: github.ref == 'refs/heads/main' && inputs.run_public_compat == true
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run public torrent client interop suite
        env:
          INTEROP_PUBLIC_TIMEOUT_SECS: "7200"
          INTEROP_PUBLIC_MAX_PARALLEL: "3"
          INTEROP_WORKDIR: ${{ runner.temp }}/torrentng-interop-${{ github.run_id }}-public
          INTEROP_REPORT: certification/reports/interop-matrix-public-${{ github.run_id }}.md
        run: scripts/interop_matrix.sh --public

      - name: Upload public torrent interop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-public-interop-${{ github.run_id }}
          path: certification/reports/interop-matrix-public-${{ github.run_id }}.md
          if-no-files-found: warn
