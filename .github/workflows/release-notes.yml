# ng-runner-policy: private-jit-only-v1
name: Release-note validation
run-name: action:${{ inputs.action }} pool:${{ inputs.runner_pool }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Requested operation
        required: true
        type: choice
        options:
          - release-note
      runner_pool:
        description: Runner pool for this operation
        required: true
        type: choice
        options: [private]
      base_sha:
        description: Commit to compare against; blank checks the parent of the current main commit
        required: false
        type: string
concurrency:
  group: ng-release-notes-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-note:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'release-note' &&
      inputs.runner_pool == 'private'
    name: Validate release-note choice
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-release-note"]}}', github.run_id)) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release-note validation
        run: python3 -m unittest scripts.test_release_notes

      - name: Validate and preview release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          head="$GITHUB_SHA"
          base="$REQUESTED_BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse --verify "${head}^")"
          fi
          python3 scripts/release_notes.py check \
            --base "$base" \
            --head "$head"
          python3 scripts/release_notes.py preview \
            --base "$base" \
            --head "$head"
