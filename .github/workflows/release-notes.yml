name: Release-note validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release-note:
    name: Validate release-note choice
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release-note validation
        run: python3 -m unittest scripts.test_release_notes

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Validate and preview release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/${PR_BASE_REF}"
            head="$PR_HEAD_SHA"
          else
            head="$GITHUB_SHA"
            base="$PUSH_BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse --verify "${head}^" 2>/dev/null || true)"
            fi
            if [[ "$PR_BODY" != *"release-note: none"* ]]; then
              associated_pr_bodies="$(gh api \
                "repos/$GITHUB_REPOSITORY/commits/$head/pulls" \
                --jq '[.[] | .body // ""] | join("\n")' 2>/dev/null || true)"
              if [[ -n "$associated_pr_bodies" ]]; then
                PR_BODY+=$'\n'"$associated_pr_bodies"
                export PR_BODY
              fi
            fi
          fi
          python3 scripts/release_notes.py check \
            --base "$base" \
            --head "$head"
          python3 scripts/release_notes.py preview \
            --base "$base" \
            --head "$head"
