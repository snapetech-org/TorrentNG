# ng-runner-policy: hosted-first-v1
name: Release-note validation

on:
  workflow_dispatch: {}
concurrency:
  group: ng-release-notes-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-note:
    if: github.event_name == 'pull_request'
    name: Validate release-note choice
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-release-note"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release-note validation
        run: python3 -m unittest scripts.test_release_notes

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Validate and preview release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # A queued PR job may start after merge. The moving branch then
            # already contains head and hides the fragment from the diff.
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            head="$GITHUB_SHA"
            base="$PUSH_BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse --verify "${head}^" 2>/dev/null || true)"
            fi
            if [[ "$PR_BODY" != *"release-note: none"* ]]; then
              associated_pr_bodies="$(gh api \
                "repos/$GITHUB_REPOSITORY/commits/$head/pulls" \
                --jq '[.[] | .body // ""] | join("\n")' 2>/dev/null || true)"
              if [[ -n "$associated_pr_bodies" ]]; then
                PR_BODY+=$'\n'"$associated_pr_bodies"
                export PR_BODY
              fi
            fi
          fi
          python3 scripts/release_notes.py check \
            --base "$base" \
            --head "$head"
          python3 scripts/release_notes.py preview \
            --base "$base" \
            --head "$head"

