name: gVisor runner smoke
run-name: action:${{ inputs.action }} pool:${{ inputs.runner_pool }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Requested operation
        required: true
        type: choice
        options:
          - gvisor-smoke
      runner_pool:
        description: Runner pool for this operation
        required: true
        type: choice
        options:
          - private

permissions: {}

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.action == 'gvisor-smoke' && inputs.runner_pool == 'private'
    timeout-minutes: 5
    runs-on:
      group: gvisor-sandbox
      labels: gvisor-sandbox
    steps:
      - name: Check runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test ! -S /var/run/docker.sock
          test ! -S /run/podman/podman.sock
          printf 'repository=%s\nrunner=%s\ncommit=%s\n' \
            "$GITHUB_REPOSITORY" "$RUNNER_NAME" "$GITHUB_SHA"
