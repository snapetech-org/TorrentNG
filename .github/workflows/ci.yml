  candidate-artifact:
    name: Private Linux x64 candidate build and smoke
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'snapetech' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'build' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha != '' &&
      inputs.candidate_sha == github.sha &&
      inputs.pr_number == '' &&
      inputs.pr_sha == '' &&
      inputs.target_run_id == ''
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-candidate-artifact"]}}', github.run_id)) }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          test -d "$runner_temp_root"
          test -w "$runner_temp_root"
          task_root="$runner_temp_root/torrentng-candidate-$GITHUB_RUN_ID"
          [[ ! -e "$task_root" ]]
          mkdir -p "$task_root/artifact" "$task_root/smoke" "$task_root/tmp"
          printf 'TMPDIR=%s\n' "$task_root/tmp" >> "$GITHUB_ENV"
          printf 'TASK_ROOT=%s\n' "$task_root" >> "$GITHUB_ENV"
          printf 'BUILD_BUNDLE=%s/artifact\n' "$task_root" >> "$GITHUB_ENV"
          printf 'SMOKE_ROOT=%s/smoke\n' "$task_root" >> "$GITHUB_ENV"
          printf 'SMOKE_CONFIG=%s/smoke-config.toml\n' "$task_root" >> "$GITHUB_ENV"
          printf 'IMAGE_TAG=torrentng-compatible-candidate:%s\n' "${CANDIDATE_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify exact main candidate and runner architecture
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${CANDIDATE_SHA,,}"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" == "${GITHUB_SHA,,}" ]]
          [[ "$(git rev-parse HEAD)" == "$candidate_sha" ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$RUNNER_ARCH" == X64 ]]
          test -z "$(git status --porcelain)"

      - name: Create task-scoped release-smoke configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/certification/fixtures/backend-burndown-native-release-smoke.toml" "$SMOKE_CONFIG" "$SMOKE_ROOT" <<'PY'
          import pathlib
          import sys

          template_path, output_path, scratch_root = map(pathlib.Path, sys.argv[1:])
          text = template_path.read_text(encoding="utf-8")
          text = text.replace(
              "/tmp/torrentng-backend-burndown-release-smoke-session",
              str(scratch_root / "session"),
          )
          text = text.replace(
              "/tmp/torrentng-backend-burndown-release-smoke-data",
              str(scratch_root / "data"),
          )
          if "/tmp/torrentng-backend-burndown-release-smoke-" in text:
              raise SystemExit("release-smoke fixture retained a shared scratch path")
          output_path.write_text(text, encoding="utf-8")
          PY

      - name: Verify private candidate artifact route
        run: python3 scripts/test_candidate_artifact_route.py

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build optimized daemon
        run: cargo build --release --locked -p torrentngd

      - name: Run authenticated release-binary smoke
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/target/release/torrentngd"
          TNG_RELEASE_BINARY="$GITHUB_WORKSPACE/target/release/torrentngd" \
          TNG_RELEASE_CONFIG="$SMOKE_CONFIG" \
          TNG_STATIC_DIR="$GITHUB_WORKSPACE/sidecar/static" \
            scripts/backend_burndown_native_release_smoke.sh "$BUILD_BUNDLE/native-release-smoke.md"
          install -m 0755 "$binary" "$BUILD_BUNDLE/torrentngd"
          tar -C "$BUILD_BUNDLE" -czf "$BUILD_BUNDLE/torrentngd-linux-x64.tar.gz" torrentngd
          python3 - "$BUILD_BUNDLE/build-metadata.json" "$BUILD_BUNDLE/torrentngd" <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import sys

          output = sys.argv[1]
          binary = pathlib.Path(sys.argv[2])
          metadata = {
              "artifact": "torrentngd",
              "architecture": platform.machine(),
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "candidate_sha": os.environ["CANDIDATE_SHA"].lower(),
              "cargo_version": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "rustc_version": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "target": "x86_64-unknown-linux-gnu",
          }
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          (
            cd "$BUILD_BUNDLE"
            sha256sum torrentngd torrentngd-linux-x64.tar.gz > SHA256SUMS
          )
          {
            printf '## Private candidate artifact\n\n'
            printf -- '- Source SHA: %s\n' "$CANDIDATE_SHA"
            printf -- '- Artifact SHA-256: %s\n' "$(awk '{print $1}' "$BUILD_BUNDLE/SHA256SUMS")"
            printf -- '- Bundle: torrentng-candidate-linux-x64-%s\n' "$CANDIDATE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build compatible-client image candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --network host \
            --build-arg "TORRENTNG_SOURCE_REVISION=$CANDIDATE_SHA" \
            -f deploy/docker/Dockerfile \
            -t "$IMAGE_TAG" .
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          docker save "$IMAGE_TAG" | gzip -1 > "$BUILD_BUNDLE/rtorrentng-compatible-image.tar.gz"
          (
            cd "$BUILD_BUNDLE"
            sha256sum rtorrentng-compatible-image.tar.gz > rtorrentng-compatible-image.tar.gz.sha256
          )
          python3 - "$BUILD_BUNDLE/rtorrentng-compatible-image.json" "$IMAGE_TAG" "$image_id" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          output, image_tag, image_id = sys.argv[1:]
          metadata = {
              "artifact": "rtorrentng-compatible-client-image",
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "candidate_sha": os.environ["CANDIDATE_SHA"].lower(),
              "image_id": image_id,
              "image_tag": image_tag,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "saved_image": "rtorrentng-compatible-image.tar.gz",
          }
          pathlib.Path(output).write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          PY
          {
            printf '\n## Compatible-client image candidate\n\n'
            printf -- '- Source SHA: %s\n' "$CANDIDATE_SHA"
            printf -- '- Image tag: `%s`\n' "$IMAGE_TAG"
            printf -- '- Image ID: `%s`\n' "$image_id"
            printf -- '- Image archive SHA-256: `%s`\n' "$(awk '{print $1}' "$BUILD_BUNDLE/rtorrentng-compatible-image.tar.gz.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private candidate artifact
        id: upload-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: torrentng-candidate-linux-x64-${{ inputs.candidate_sha }}
          path: ${{ env.BUILD_BUNDLE }}
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact reference
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
        run: |
          printf 'Artifact ID: %s\n' "$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate failure evidence
        if: failure() && env.BUILD_BUNDLE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: torrentng-candidate-failure-${{ github.run_id }}
          path: ${{ env.BUILD_BUNDLE }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove task-scoped JIT scratch
        if: always() && env.TASK_ROOT != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ -e "$TASK_ROOT" ]] || exit 0
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          task_root="$(realpath -e -- "$TASK_ROOT")"
          [[ "$task_root" == "$runner_temp_root/torrentng-candidate-$GITHUB_RUN_ID" ]]
          if pgrep -x torrentngd >/dev/null; then
            echo "torrentngd is still running; preserving candidate scratch" >&2
            exit 1
          fi
          if [[ -n "${IMAGE_TAG:-}" ]]; then
            docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
          fi
          rm -rf -- "$task_root"
          test ! -e "$task_root"

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action != '' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name == 'pull_request_target' && github.actor == 'snapetech' && github.event.pull_request.user.login == 'snapetech' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.ref == 'main' && (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') && contains(github.event.pull_request.labels.*.name, 'action:ci') && contains(github.event.pull_request.labels.*.name, 'pool:private')
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          expected='snapetech-org/TorrentNG'
          repository=os.environ['GITHUB_REPOSITORY'];number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();target=os.environ['TARGET_RUN_ID'];token=os.environ['GH_TOKEN']
          if repository.lower()!=expected.lower() or not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not re.fullmatch(r'[1-9][0-9]*',target):raise SystemExit('invalid PR claim')
          payload=json.dumps({"ref": "main", "inputs": {"action": "ci", "runner_pool": "private", "pr_number": number, "pr_sha": sha, "target_run_id": target}}).encode()
          request=Request(
            'https://api.github.com/repos/snapetech-org/TorrentNG/actions/workflows/ci.yml/dispatches',
            data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status!=204:raise SystemExit(f'dispatch HTTP {response.status}')
          PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [native-quality, backend-fault-matrix, backend-api-load, msrv-check, msrv-check-sidecar, fuzz-smoke, sidecar, desktop, webui, backup-restore, security-audit]
    if: >-
      always() &&
      inputs.candidate_sha == '' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'ci' && inputs.runner_pool == 'private' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULTS: '{"native-quality":"${{ needs.native-quality.result }}","backend-fault-matrix":"${{ needs.backend-fault-matrix.result }}","backend-api-load":"${{ needs.backend-api-load.result }}","msrv-check":"${{ needs.msrv-check.result }}","msrv-check-sidecar":"${{ needs.msrv-check-sidecar.result }}","fuzz-smoke":"${{ needs.fuzz-smoke.result }}","sidecar":"${{ needs.sidecar.result }}","desktop":"${{ needs.desktop.result }}","webui":"${{ needs.webui.result }}","backup-restore":"${{ needs.backup-restore.result }}","security-audit":"${{ needs.security-audit.result }}"}'
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();results=json.loads(os.environ['VALIDATION_RESULTS'])
          if not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not results:raise SystemExit('invalid PR check claim')
          conclusion='success' if all(v=='success' for v in results.values()) else 'failure'
          summary='Main-pinned, no-secret owner PR validation:\n'+'\n'.join(f'- {n}: {v}' for n,v in results.items())
          run_id=os.environ['VALIDATION_RUN_ID']
          payload=json.dumps({"name": "TorrentNG owner PR validation", "head_sha": sha, "external_id": run_id, "status": "completed", "conclusion": conclusion, "details_url": "https://github.com/snapetech-org/TorrentNG/actions/runs/" + run_id, "output": {"title": "Owner PR validation " + conclusion, "summary": summary}}).encode()
          request=Request('https://api.github.com/repos/snapetech-org/TorrentNG/check-runs',data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status not in {201,202}:raise SystemExit(f'check HTTP {response.status}')
          PY
