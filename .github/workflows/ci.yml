# ng-runner-policy: private-jit-only-v1
name: CI
run-name: >-
  ${{ github.event_name == 'pull_request_target' &&
      format('action:ci:pool:private') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != '' && inputs.runner_pool != '' &&
      format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool)) ||
      github.workflow }}

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
  workflow_dispatch:
    inputs:

      action:
        description: Requested operation
        required: true
        type: choice
        options:
          - ci
          - build
      runner_pool:
        description: Runner pool for this operation
        required: true
        type: choice
        options: [private]
      candidate_sha:
        description: Exact main SHA for a private Linux x64 build artifact (no release)
        required: false
        type: string
      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      target_run_id:
        description: Successful metadata-only pull_request_target run ID
        required: false
        type: string
concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-quality:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    name: TorrentNG client quality
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-native-quality"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          test -d "$runner_temp_root"
          test -w "$runner_temp_root"
          printf 'TMPDIR=%s\n' "$runner_temp_root" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo fmt --all -- --check

      - name: Test shared runner policy
        run: python3 scripts/test_workflow_runner_policy.py

      - name: Test seed efficiency measurement and provenance
        run: python3 -m unittest scripts.test_native_seed_cpu_ram_probe scripts.test_seed_efficiency_tools scripts.test_native_seed_function_order

      - name: Validate TorrentNG API contract
        run: python3 scripts/validate_openapi.py

      - name: Test protected API target and load-runner boundaries
        run: |
          # These safety tests reject system paths such as /opt, so keep their fixtures under disposable /tmp.
          TMPDIR=/tmp python3 -m unittest scripts.test_protected_target scripts.test_backend_burndown_api_load scripts.test_workflow_security scripts.test_security_scan_local scripts.test_release_notes
          sh scripts/test_promote_dockerhub_tags.sh

      - name: Test TorrentNG client workspace
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

      - name: Test daemon with full compatibility APIs
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --locked -p torrentngd --bin torrentngd --features full-compat

      - name: Test optional mapped seed backing and verification scratch
        env:
          TNG_STORAGE_ANON_LARGE_FRAMES: "1"
        run: cargo test --locked -p rt-storage -p rt-engine --features seed-mmap --lib

      - name: Lint TorrentNG client workspace
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint daemon with full compatibility APIs
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --locked -p torrentngd --bin torrentngd --features full-compat -- -D warnings

      - name: Run certification script self-tests
        run: |
          bash scripts/certification_policy_selftest.sh
          bash scripts/certification_bundle_selftest.sh
          bash scripts/storage_certification_selftest.sh

  backend-fault-matrix:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    name: Backend fault-containment matrix
    needs: native-quality
    timeout-minutes: 20
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-backend-fault-matrix"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run deterministic fault matrix
        run: |
          TNG_FAULT_MATRIX_STRICT=0 \
            scripts/backend_burndown_fault_matrix.sh \
            "certification/reports/backend-burndown-fault-matrix-ci-${GITHUB_RUN_ID}.md"

      - name: Upload fault matrix evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-fault-matrix-${{ github.run_id }}
          path: |
            certification/reports/backend-burndown-fault-matrix-ci-*
            certification/reports/backend-burndown-fault-*.log
          if-no-files-found: warn

  backend-api-load:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    name: Isolated TorrentNG API/SSE load harness
    needs: native-quality
    timeout-minutes: 30
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-backend-api-load"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build TorrentNG client release daemon
        run: cargo build --release --locked -p torrentngd

      - name: Run concurrent API and slow-SSE load
        shell: bash
        run: |
          set -euo pipefail
          TORRENTNGD_CONFIG=certification/fixtures/backend-burndown-native-release-smoke.toml \
          TNG_STATIC_DIR=sidecar/static \
            target/release/torrentngd > "/tmp/torrentng-api-load-${GITHUB_RUN_ID}.log" 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if curl -fsS \
              -H 'Authorization: Bearer backend-burndown-token-20260902' \
              http://127.0.0.1:28080/health >/dev/null; then
              break
            fi
            sleep 0.1
          done
          TNG_BASE_URL=http://127.0.0.1:28080 \
          TNG_API_TOKEN=backend-burndown-token-20260902 \
          TNG_LOAD_PID="$pid" \
          TNG_LOAD_DURATION_SECONDS=15 \
          TNG_LOAD_CLIENTS=16 \
          TNG_LOAD_SSE_CLIENTS=4 \
          TNG_LOAD_SLOW_DELAY_MS=100 \
          TNG_LOAD_COMMIT="$GITHUB_SHA" \
          TNG_LOAD_BINARY=target/release/torrentngd \
            scripts/backend_burndown_api_load.py \
            "certification/reports/backend-api-load-ci-${GITHUB_RUN_ID}.md"

      - name: Upload API load evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-api-load-${{ github.run_id }}
          path: |
            certification/reports/backend-api-load-ci-*
            /tmp/torrentng-api-load-${{ github.run_id }}.log
          if-no-files-found: warn

  # TNG-025: native-quality tracks stable; this separate gate builds and
  # tests the locked workspace at the declared Rust 1.88 MSRV.
  msrv-check:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-msrv-check"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          test -d "$runner_temp_root"
          test -w "$runner_temp_root"
          printf 'TMPDIR=%s\n' "$runner_temp_root" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust 1.88.0 (declared MSRV)
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      - name: Build TorrentNG client workspace at declared MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: cargo build --workspace --all-targets --locked

      - name: Test TorrentNG client workspace at declared MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        # The scale targets contain wall-clock assertions. Run the MSRV
        # suite serially so unrelated 15k/50k fixtures cannot steal CPU from
        # the endpoint being measured and turn the gate into scheduler noise.
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  msrv-check-sidecar:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    name: Compatible-client service MSRV gate
    timeout-minutes: 30
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-msrv-check-sidecar"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          test -d "$runner_temp_root"
          test -w "$runner_temp_root"
          printf 'TMPDIR=%s\n' "$runner_temp_root" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust 1.97.0 (compatible-client service declared MSRV)
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Build compatible-client service at declared MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.97.0"
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test compatible-client service at declared MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.97.0"
        run: cargo test --locked --manifest-path sidecar/Cargo.toml -- --test-threads=1

  fuzz-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    timeout-minutes: 30
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-fuzz-smoke"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          test -d "$runner_temp_root"
          test -w "$runner_temp_root"
          printf 'TMPDIR=%s\n' "$runner_temp_root" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly

      - name: Install cargo-fuzz into job-private storage
        shell: bash
        run: |
          set -euo pipefail
          cargo_fuzz_root="$(mktemp -d -- "$TMPDIR/cargo-fuzz.XXXXXX")"
          cargo install cargo-fuzz --locked --root "$cargo_fuzz_root" --force
          printf '%s\n' "$cargo_fuzz_root/bin" >> "$GITHUB_PATH"

      # TNG-027: bounded smoke run, not a real fuzzing campaign -- this
      # exists to catch a target that's gone stale (no longer builds
      # against the current parser API) or an immediately-reachable
      # crash, not to find deep bugs on every PR. Each target gets a
      # fixed, short time budget so this job stays fast and deterministic
      # in CI; real fuzzing runs happen out-of-band with a much larger
      # budget.
      - name: Fuzz parse_torrent (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run parse_torrent -- -max_total_time=60

      - name: Fuzz bencode_decode (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run bencode_decode -- -max_total_time=60

      # Peer-wire, DHT, and tracker codecs decode bytes from the swarm
      # (untrusted peers, DHT nodes, and configured trackers) before
      # anything else validates them -- the same bounded-smoke rationale
      # as the two targets above applies to each of these.
      - name: Fuzz peer_wire_handshake (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run peer_wire_handshake -- -max_total_time=60

      - name: Fuzz peer_wire_message (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run peer_wire_message -- -max_total_time=60

      - name: Fuzz peer_wire_extension_handshake (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run peer_wire_extension_handshake -- -max_total_time=60

      - name: Fuzz peer_wire_ut_metadata (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run peer_wire_ut_metadata -- -max_total_time=60

      - name: Fuzz dht_krpc_message (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run dht_krpc_message -- -max_total_time=60

      - name: Fuzz tracker_udp_connect_response (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run tracker_udp_connect_response -- -max_total_time=60

      - name: Fuzz tracker_udp_announce_response (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run tracker_udp_announce_response -- -max_total_time=60

      - name: Fuzz tracker_http_announce_response (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run tracker_http_announce_response -- -max_total_time=60

      - name: Fuzz tracker_scrape_stats (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run tracker_scrape_stats -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  sidecar:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    name: Compatible-client service quality
    timeout-minutes: 30
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-sidecar"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          runner_temp_root="$(realpath -e -- "$RUNNER_TEMP")"
          test -d "$runner_temp_root"
          test -w "$runner_temp_root"
          printf 'TMPDIR=%s\n' "$runner_temp_root" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        if: inputs.pr_number == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build compatible-client service
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test compatible-client service
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --locked --manifest-path sidecar/Cargo.toml -- --test-threads=1

  desktop:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'ci' &&
      inputs.runner_pool == 'private' &&
      inputs.candidate_sha == '' &&
      (
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '') ||
        ((github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
         inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '')
      )
    name: Desktop client quality
    timeout-minutes: 40
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-desktop"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
