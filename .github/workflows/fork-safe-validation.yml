# ng-runner-policy: public-fork-jit-v1
name: TorrentNG offline fork PR checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  unit-tests:
    name: Offline security and release-note unit tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/TorrentNG' &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.label.name == 'action:fork-validation' || github.event.label.name == 'pool:public') &&
      contains(github.event.pull_request.labels.*.name, 'action:fork-validation') &&
      contains(github.event.pull_request.labels.*.name, 'pool:public')
    runs-on:
      group: public-fork-jit
      labels: [self-hosted, linux, x64, public-pr-torrentng, ng-public-run-${{ github.run_id }}]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run offline policy unit tests
        run: python3 -m unittest scripts.test_protected_target scripts.test_release_notes scripts.test_backend_burndown_api_load
