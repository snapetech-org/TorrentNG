# ng-runner-policy: public-fork-jit-v1
name: TorrentNG offline fork PR checks
on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      runner_pool:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      pr_head_repo:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  unit-tests:
    name: Offline security and release-note unit tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.actor == 'snapetech' &&
      (startsWith(github.event.label.name, 'action:') || startsWith(github.event.label.name, 'pool:')) &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      (contains(github.event.pull_request.labels.*.name, 'pool:public') || contains(github.event.pull_request.labels.*.name, 'pool:hybrid')) &&
      inputs.action == 'ci' &&
      (inputs.runner_pool == 'public' || inputs.runner_pool == 'hybrid') &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/TorrentNG' &&
      github.event.pull_request.base.ref == 'main' &&
      inputs.pr_number == github.event.pull_request.number &&
      inputs.pr_head_repo == github.event.pull_request.head.repo.full_name &&
      inputs.pr_head_sha == github.event.pull_request.head.sha
    runs-on:
      group: public-fork-jit
      labels: [self-hosted, linux, x64, public-pr-torrentng, "ng-public-run-${{ github.run_id }}"]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.pr_head_repo }}
          ref: ${{ inputs.pr_head_sha }}
          persist-credentials: false
      - name: Run offline policy unit tests
        run: python3 -m unittest scripts.test_protected_target scripts.test_release_notes scripts.test_backend_burndown_api_load
