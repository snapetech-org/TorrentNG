# ng-runner-policy: hosted-first-v1
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-validate-release-tag"]}}', github.run_id)) }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker stable tag policy
        run: sh scripts/check_docker_tag_sync.sh

      - name: Validate tag and provenance
        id: tag
        env:
          REQUESTED_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ && ! "$tag" =~ ^main-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
            [[ "$tag" == *..* ]] || ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          git fetch --force origin main --tags
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")"
          if [[ -z "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag must point to a commit on origin/main." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-notes:
    name: Assemble release notes
    needs: validate-release-tag
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-release-notes"]}}', github.run_id)) }}
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.release-body.outputs.release_body }}
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Find previous published release
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_release.py previous-tag --current-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Assemble curated release notes
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--head "$RELEASE_TAG" --output release-notes.md)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--base "$PREVIOUS_TAG")
          fi
          python3 scripts/release_notes.py assemble "${args[@]}"
          test -s release-notes.md
          cat release-notes.md

      - name: Export release body
        id: release-body
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release_body_${GITHUB_RUN_ID}"
          {
            echo "release_body<<${delimiter}"
            cat release-notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  native-quality:
    name: TorrentNG client and compatible-client service quality gate
    needs: validate-release-tag
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-native-quality"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate TorrentNG API contract
        run: python3 scripts/validate_openapi.py

      - name: Test protected API target and load-runner boundaries
        run: TMPDIR=/tmp python3 -m unittest scripts.test_protected_target scripts.test_backend_burndown_api_load scripts.test_workflow_security scripts.test_security_scan_local scripts.test_release_notes

      - name: Test TorrentNG client workspace
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

      - name: Lint TorrentNG client workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check compatible-client service formatting
        run: cargo fmt --manifest-path sidecar/Cargo.toml -- --check

      - name: Test compatible-client service
        run: cargo test --locked --manifest-path sidecar/Cargo.toml -- --test-threads=1

      - name: Lint compatible-client service
        run: cargo clippy --all-targets --locked --manifest-path sidecar/Cargo.toml -- -D warnings

  msrv-check:
    name: Main workspace MSRV gate
    needs: [validate-release-tag, native-quality]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-msrv-check"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      - name: Build TorrentNG client workspace at declared MSRV
        run: cargo build --workspace --all-targets --locked

      - name: Test TorrentNG client workspace at declared MSRV
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  msrv-check-sidecar:
    name: Compatible-client service MSRV gate
    needs: [validate-release-tag, native-quality]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-msrv-check-sidecar"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Build compatible-client service at declared MSRV
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test compatible-client service at declared MSRV
        run: cargo test --locked --manifest-path sidecar/Cargo.toml -- --test-threads=1

  security-audit:
    name: Release dependency security gate
    needs: [validate-release-tag, native-quality]
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-security-audit"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # pinned action
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan source, dependencies, and configuration
        run: ./scripts/security-scan-local.sh --trivy-only --ci

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file sidecar/Cargo.lock
          cargo audit --file fuzz/Cargo.lock
          cargo audit --file crates/torrentng-desktop/Cargo.lock

      - name: Audit compatible-client service Rust dependencies
        run: cargo audit --file sidecar/Cargo.lock

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Audit WebUI dependencies
        working-directory: webui
        run: |
          npm ci
          npm test
          npm audit --audit-level=high

  native-release-smoke:
    name: Native release-binary smoke
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-native-release-smoke"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build native release binary
        run: cargo build --release --locked -p torrentngd

      - name: Run authenticated release-binary smoke
        run: |
          set -euo pipefail
          TNG_RELEASE_CONFIG=certification/fixtures/backend-burndown-native-release-smoke.toml \
          TNG_RELEASE_TOKEN=backend-burndown-token-20260902 \
            scripts/backend_burndown_native_release_smoke.sh \
            "certification/reports/backend-burndown-native-release-smoke-ci-${GITHUB_RUN_ID}.md"

      - name: Run backup and restore drill
        run: |
          scripts/backup_restore_certification.sh \
            "certification/reports/backup-restore-release-${GITHUB_RUN_ID}.md"

      - name: Upload native release smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-smoke-${{ github.run_id }}
          path: |
            certification/reports/backend-burndown-native-release-smoke-ci-*
            certification/reports/backup-restore-release-*
          if-no-files-found: error

  native-binaries:
    name: Native binary (${{ matrix.suffix }})
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit, native-release-smoke]
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: torrentngd
            archive: tar.gz
          - os: ubuntu-latest
            suffix: linux-aarch64
            target: aarch64-unknown-linux-gnu
            binary: torrentngd
            archive: tar.gz
          - os: macos-14
            suffix: macos-aarch64
            target: aarch64-apple-darwin
            binary: torrentngd
            archive: tar.gz
          - os: ubuntu-latest
            suffix: windows-x86_64
            target: x86_64-pc-windows-gnu
            binary: torrentngd.exe
            archive: zip
    runs-on: ${{ matrix.os == 'macos-14' && fromJSON('{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple"]}') || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-{1}-native-binaries"]}}', github.run_id, strategy.job-index)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Windows GNU cross compiler
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          TNG_WEBUI_OUT_DIR=dist npm run build

      - name: Build TorrentNG client daemon
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        shell: bash
        run: cargo build --target "$RELEASE_TARGET" --release --locked -p torrentngd

      - name: Verify TorrentNG client daemon artifact
        env:
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$RELEASE_TARGET/release/$RELEASE_BINARY"
          if [[ "$RELEASE_TARGET" == "x86_64-unknown-linux-gnu" || "$RELEASE_TARGET" == "aarch64-apple-darwin" ]]; then
            "$binary" --version
          else
            file "$binary"
            case "$RELEASE_TARGET" in
              aarch64-unknown-linux-gnu) file "$binary" | grep -Eq 'ARM aarch64|AArch64' ;;
              x86_64-pc-windows-gnu) file "$binary" | grep -Eq 'PE32\+ executable.*x86-64' ;;
              *) echo "unexpected cross target: $RELEASE_TARGET" >&2; exit 1 ;;
            esac
          fi

      - name: Package TorrentNG client assets
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_SUFFIX: ${{ matrix.suffix }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?RELEASE_TAG must be set}"
          suffix="${RELEASE_SUFFIX:?RELEASE_SUFFIX must be set}"
          binary="${RELEASE_BINARY:?RELEASE_BINARY must be set}"
          target="${RELEASE_TARGET:?RELEASE_TARGET must be set}"
          mkdir -p dist native/usr/bin native/usr/share/torrentng/webui
          artifact_suffix=""
          if [[ "$binary" == "torrentngd.exe" ]]; then
            artifact_suffix=".exe"
          fi
          cp "target/$target/release/$binary" "dist/torrentngd-${suffix}${artifact_suffix}"
          cp "target/$target/release/$binary" "native/usr/bin/$binary"
          cp -a webui/dist/. native/usr/share/torrentng/webui/
          if [[ "$RELEASE_ARCHIVE" == "zip" ]]; then
            NATIVE_ROOT=native ARCHIVE_PATH="dist/torrentngd-native-${tag}-${suffix}.zip" python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(os.environ["NATIVE_ROOT"])
          with ZipFile(os.environ["ARCHIVE_PATH"], "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PY
          else
            tar -czf "dist/torrentngd-native-${tag}-${suffix}.tar.gz" -C native .
          fi

      - name: Upload TorrentNG client artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.suffix }}
          path: dist/*

  desktop-bundles:
    name: Desktop app (${{ matrix.suffix }})
    needs: [validate-release-tag, native-quality, security-audit, native-binaries]
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            target: x86_64-unknown-linux-gnu
            kind: linux
            desktop_bin: torrentng-desktop
            engine_bin: torrentngd-linux-x86_64
          - os: ubuntu-latest
            suffix: linux-aarch64
            target: aarch64-unknown-linux-gnu
            kind: linux
            desktop_bin: torrentng-desktop
            engine_bin: torrentngd-linux-aarch64
          - os: macos-14
            suffix: macos-aarch64
            target: aarch64-apple-darwin
            kind: macos
            desktop_bin: torrentng-desktop
            engine_bin: torrentngd-macos-aarch64
          - os: ubuntu-latest
            suffix: windows-x86_64
            target: x86_64-pc-windows-gnu
            kind: windows
            desktop_bin: torrentng-desktop.exe
            engine_bin: torrentngd-windows-x86_64.exe
    runs-on: ${{ matrix.os == 'macos-14' && fromJSON('{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple"]}') || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-{1}-desktop-bundles"]}}', github.run_id, strategy.job-index)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Windows GNU cross compiler
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64

      - name: Build desktop client
        env:
          BUNDLE_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        shell: bash
        run: cargo build --target "$BUNDLE_TARGET" --release --locked --manifest-path crates/torrentng-desktop/Cargo.toml

      # Bundle the exact daemon binary published as the Server download.
      - name: Download matching engine binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ matrix.suffix }}
          path: engine

      - name: Package desktop bundles
        shell: bash
        env:
          BUNDLE_KIND: ${{ matrix.kind }}
          BUNDLE_SUFFIX: ${{ matrix.suffix }}
          BUNDLE_TARGET: ${{ matrix.target }}
          DESKTOP_BIN: ${{ matrix.desktop_bin }}
          ENGINE_BIN: ${{ matrix.engine_bin }}
        run: |
          set -euo pipefail
          packaging/desktop/package.sh \
            "$BUNDLE_KIND" "$BUNDLE_SUFFIX" "${RELEASE_TAG:?}" \
            "crates/torrentng-desktop/target/$BUNDLE_TARGET/release/$DESKTOP_BIN" \
            "engine/$ENGINE_BIN" dist

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  linux-release-assets:
    name: Linux containers and shared assets
    concurrency:
      group: dockerhub-stable-aliases
      cancel-in-progress: false
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit, native-release-smoke]
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-linux-release-assets"]}}', github.run_id)) }}
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build compatible-client service
        run: cargo build --release --locked --manifest-path sidecar/Cargo.toml

      - name: Run compatible-client service tests
        run: cargo test --locked --manifest-path sidecar/Cargo.toml -- --test-threads=1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          TNG_WEBUI_OUT_DIR=dist npm run build

      - name: Build Docker images
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          source_revision="$(git rev-parse HEAD)"
          docker build --pull --network host --build-arg "TORRENTNG_SOURCE_REVISION=$source_revision" -f deploy/native/Dockerfile -t "torrentng-native:${RELEASE_TAG}" .
          docker build --pull --network host --build-arg "TORRENTNG_SOURCE_REVISION=$source_revision" -f deploy/docker/Dockerfile -t "torrentng:${RELEASE_TAG}" .
          docker build --pull --network host --build-arg "TORRENTNG_SOURCE_REVISION=$source_revision" -f deploy/docker/Dockerfile.phase1 -t "torrentng-phase1:${RELEASE_TAG}" .

      - name: Smoke native image with authenticated read-only runtime
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          name="torrentng-native-smoke-${GITHUB_RUN_ID}"
          data_volume="${name}-data"
          downloads_volume="${name}-downloads"
          state_volume="${name}-state"
          config_volume="${name}-config"
          containers=("$name")
          volumes=("$data_volume" "$downloads_volume" "$state_volume" "$config_volume")
          cleanup() {
            docker rm -f "${containers[@]}" >/dev/null 2>&1 || true
            docker volume rm "${volumes[@]}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for volume in "${volumes[@]}"; do
            docker volume create "$volume" >/dev/null
          done
          docker run -d --name "$name" --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /run:rw,nosuid,nodev,size=16m \
            -v "$data_volume:/data" \
            -v "$downloads_volume:/downloads" \
            -v "$state_volume:/var/lib/torrentngd" \
            -v "$config_volume:/config" \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TORRENTNGD_API_TOKEN=release-smoke-only-token \
            "torrentng-native:${RELEASE_TAG}" >/dev/null

          healthy=0
          for _ in $(seq 1 60); do
            if docker exec "$name" curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != 1 ]]; then
            docker logs "$name"
            exit 1
          fi
          [[ "$(docker exec "$name" awk '/^Uid:/{print $2}' /proc/1/status)" == 1000 ]]
          [[ "$(docker exec "$name" awk '/^Gid:/{print $2}' /proc/1/status)" == 1000 ]]
          docker exec --user 1000:1000 "$name" sh -c \
            'test -w /data && test -w /downloads && test -w /var/lib/torrentngd && test -w /run/secrets/torrentngd_api_token'
          docker exec "$name" /usr/local/bin/torrentngd --version

      - name: Smoke compatible-client image with root-owned persistent files
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}"
          containers=()
          volumes=()
          cleanup() {
            docker rm -f "${containers[@]}" >/dev/null 2>&1 || true
            docker volume rm "${volumes[@]}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          run_smoke() {
            local name="torrentng-identity-smoke-${suffix}-$1"
            local data_dir="$2"
            local log_volume="${name}-log"
            local default_volume="${name}-default-data"
            local override_volume="${name}-override-data"
            containers+=("$name")
            volumes+=("$log_volume" "$default_volume" "$override_volume")
            docker volume create "$log_volume" >/dev/null
            docker volume create "$default_volume" >/dev/null
            docker volume create "$override_volume" >/dev/null
            docker run --rm --entrypoint /bin/sh \
              -v "$log_volume:/var/log/rtorrent" \
              -v "$default_volume:/var/lib/torrentng" \
              -v "$override_volume:/var/lib/rtorrentng" alpine:3.20 \
              -c 'touch /var/log/rtorrent/rtorrent.log /var/lib/torrentng/cache.db /var/lib/rtorrentng/cache.db && chmod 0664 /var/log/rtorrent/rtorrent.log /var/lib/torrentng/cache.db /var/lib/rtorrentng/cache.db'
            docker run -d --name "$name" --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --tmpfs /run:rw,nosuid,nodev,size=128m \
              -v "$log_volume:/var/log/rtorrent" \
              -v "$default_volume:/var/lib/torrentng" \
              -v "$override_volume:/var/lib/rtorrentng" \
              -e "TNG_DATA_DIR=$data_dir" \
              -e RTORRENT_STARTUP_GRACE_SECS=0 \
              -e TNG_SECRET_KEY=release-smoke-only-session-secret \
              -e TNG_API_TOKENS=release-smoke-only-token \
              "torrentng:${RELEASE_TAG}" >/dev/null

            local healthy=0
            for _ in $(seq 1 60); do
              if docker exec "$name" wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 1
            done
            if [[ "$healthy" != 1 ]]; then
              docker logs "$name"
              return 1
            fi
            docker exec "$name" test -S /run/rtorrent/rpc.sock
            docker exec --user 1000:1000 "$name" sh -c 'test -w /var/log/rtorrent/rtorrent.log && test -w /var/lib/torrentng && test -w /var/lib/torrentng/cache.db && test -w /var/lib/rtorrentng && test -w /var/lib/rtorrentng/cache.db'
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/log/rtorrent/rtorrent.log)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/torrentng)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/torrentng/cache.db)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/rtorrentng)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/rtorrentng/cache.db)" == "1000:1000" ]]
            docker rm -f "$name" >/dev/null
          }

          run_smoke override /var/lib/rtorrentng
          run_smoke default /var/lib/torrentng

      - name: Publish Docker images
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#main-}"
          version="${version#v}"
          stable_tag_pattern='^(v[0-9]{8}-[0-9]+|main-[0-9]{8}-[0-9]+)$'
          latest_stable_tag="$(
            git ls-remote --tags origin 'refs/tags/main-*' 'refs/tags/v*' |
              awk -v stable_tag_pattern="$stable_tag_pattern" '
                $2 !~ /\^\{\}$/ {
                  sub(/^refs\/tags\//, "", $2)
                  tag = $2
                  version = tag
                  sub(/^main-/, "", version)
                  sub(/^v/, "", version)
                  if (tag ~ stable_tag_pattern && version ~ /^[0-9]{8}-[0-9]+$/) print version "\t" tag
                }
              ' |
              sort -V |
              tail -n 1 |
              cut -f2
          )"
          is_latest_stable=false
          if [[ "$RELEASE_TAG" =~ $stable_tag_pattern && "$RELEASE_TAG" == "$latest_stable_tag" ]]; then
            is_latest_stable=true
            echo "Publishing stable aliases from latest stable release $RELEASE_TAG."
          else
            echo "Publishing immutable image tags for $RELEASE_TAG; latest stable release is $latest_stable_tag."
          fi

          if [[ -z "${DOCKERHUB_USERNAME:-}" || -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo 'Docker Hub publisher credentials are required for stable releases.' >&2
            exit 1
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          publish_image() {
            local local_image="$1"
            local ghcr_image="$2"
            shift 2
            local dockerhub_images=("$@")
            for tag in "$RELEASE_TAG" "$version"; do
              docker tag "$local_image:$RELEASE_TAG" "$ghcr_image:$tag"
              docker push "$ghcr_image:$tag"
              for dockerhub_image in "${dockerhub_images[@]}"; do
                docker tag "$local_image:$RELEASE_TAG" "$dockerhub_image:$tag"
                docker push "$dockerhub_image:$tag"
              done
            done

            if [[ "$is_latest_stable" == true ]]; then
              for stable_alias in latest main master stable; do
                docker tag "$local_image:$RELEASE_TAG" "$ghcr_image:$stable_alias"
                docker push "$ghcr_image:$stable_alias"
                for dockerhub_image in "${dockerhub_images[@]}"; do
                  docker tag "$local_image:$RELEASE_TAG" "$dockerhub_image:$stable_alias"
                  docker push "$dockerhub_image:$stable_alias"
                done
              done
            fi
          }

          publish_image torrentng-native ghcr.io/snapetech/torrentng/native snapetech/torrentng-native
          publish_image torrentng ghcr.io/snapetech/torrentng/sidecar snapetech/torrentng-sidecar snapetech/torrentng
          publish_image torrentng-phase1 ghcr.io/snapetech/torrentng/phase1 snapetech/torrentng-phase1

      - name: Package shared assets
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          mkdir -p dist
          cp sidecar/target/release/torrentng "dist/torrentng-linux-x86_64"
          tar -czf "dist/torrentng-webui-${tag}.tar.gz" -C webui/dist .
          tar -czf "dist/torrentng-deploy-${tag}.tar.gz" deploy docs README.md LICENSE

      - name: Upload shared artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shared-linux-assets
          path: dist/*

  publish:
    name: Publish release
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-publish"]}}', github.run_id)) }}
    needs:
      - validate-release-tag
      - release-notes
      - native-binaries
      - desktop-bundles
      - linux-release-assets
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Route temporary files to runner temp
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > "SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
          RELEASE_BODY: ${{ needs.release-notes.outputs.release_body }}
        shell: bash
        run: python3 scripts/github_release.py publish --tag "$RELEASE_TAG" --title "TorrentNG $RELEASE_TAG" --body-env RELEASE_BODY --asset-dir dist

      - name: Dispatch AUR publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: python3 scripts/github_release.py dispatch --workflow release-aur.yml --ref main --tag "$RELEASE_TAG"

      - name: Dispatch COPR publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: python3 scripts/github_release.py dispatch --workflow release-copr.yml --ref main --tag "$RELEASE_TAG"

      - name: Check legacy GHCR credential
        id: legacy-ghcr
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${GHCR_LEGACY_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Legacy GHCR aliases will be left unchanged because GHCR_LEGACY_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Buildx for legacy GHCR aliases
        if: steps.legacy-ghcr.outputs.configured == 'true'
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to legacy GHCR packages
        if: steps.legacy-ghcr.outputs.configured == 'true'
        continue-on-error: true
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        shell: bash
        run: printf '%s' "$GHCR_LEGACY_TOKEN" | docker login ghcr.io --username snapetech --password-stdin

      - name: Sync Unraid legacy GHCR aliases
        if: steps.legacy-ghcr.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        run: bash scripts/sync_legacy_ghcr_aliases.sh

      - name: Check Discord webhook configuration
        id: discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        shell: bash
        run: |
          if [[ -n "${DISCORD_RELEASE_WEBHOOK:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce release on Discord
        if: success() && steps.discord.outputs.configured == 'true'
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
          RELEASE_BODY: ${{ needs.release-notes.outputs.release_body }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          body="$RELEASE_BODY"
          if (( ${#body} > 3800 )); then
            body="${body:0:3797}…"
          fi
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg url "$release_url" \
            --arg description "$body" \
            '{
              username: "TorrentNG releases",
              embeds: [{
                title: ("TorrentNG " + $tag + " released"),
                url: $url,
                description: $description,
                color: 3447003,
                fields: [
                  {name: "Tag", value: $tag, inline: true},
                  {name: "Release", value: $url, inline: false}
                ]
              }]
            }' > discord-payload.json
          curl -fsS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_RELEASE_WEBHOOK"
