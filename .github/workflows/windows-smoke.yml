# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: Windows Smoke
run-name: action:${{ inputs.action }} pool:${{ inputs.runner_pool }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Requested operation
        required: true
        type: choice
        options:
          - windows-smoke
      runner_pool:
        description: Runner pool for this operation
        required: true
        type: choice
        options: [private]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.action == 'windows-smoke' && inputs.runner_pool == 'private'
    timeout-minutes: 45
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","TorrentNG","gha-{0}-smoke"]}}', github.run_id)) }}
    # The certification evidence contains paths longer than Win32's default
    # MAX_PATH. Expose Git's long-path setting to checkout and later Git calls.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Cache Cargo package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Select Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"

      - name: Enable Visual Studio compiler environment
        run: .\scripts\enable-msvc-environment.ps1
        shell: powershell

      - name: Build compatible-client service
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test compatible-client service
        run: cargo test --locked --manifest-path sidecar/Cargo.toml -- --test-threads=1

      # rt-storage ships a non-Unix fallback executor for move/import/delete
      # plans (plan.rs's cfg(not(unix)) path) that release.yml proves compiles
      # for Windows but that no CI job actually ran until now -- this is the
      # only job that runs the TorrentNG client workspace on a real Windows machine.
      - name: Test TorrentNG storage plan executor
        run: cargo test --locked -p rt-storage

      - name: Test production v1, v2, and hybrid compatibility fixtures
        run: cargo test --locked -p rt-testkit -p rt-metainfo -p rt-piece-map

      - name: Build webui
        working-directory: webui
        run: |
          npm.cmd ci
          npm.cmd run build
