name: TorrentNG fork PR validation
run-name: action:fork-validation pool:public pr-${{ github.event.pull_request.number }}
on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate:
    name: Run disposable fork validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/TorrentNG' &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.label.name == 'action:fork-validation' || github.event.label.name == 'pool:public') &&
      contains(github.event.pull_request.labels.*.name, 'action:fork-validation') &&
      contains(github.event.pull_request.labels.*.name, 'pool:public')
    permissions:
      contents: read
    uses: ./.github/workflows/fork-safe-validation.yml
    with:
      action: fork-validation
      runner_pool: public
      pr_number: ${{ github.event.pull_request.number }}
      pr_head_repo: ${{ github.event.pull_request.head.repo.full_name }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
