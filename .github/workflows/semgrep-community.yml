# ng-runner-policy: private-jit-only-v1
name: Semgrep Community Edition

run-name: action:${{ inputs.action }} pool:${{ inputs.runner_pool }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Requested operation
        required: true
        type: choice
        options:
          - semgrep
      runner_pool:
        description: Runner pool for this operation
        required: true
        type: choice
        options: [private]
permissions:
  contents: read

concurrency:
  group: ng-scan-semgrep-community-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  semgrep:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/main'
    name: Semgrep CE (community rules)
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-torrentng","ng-main-run-{0}","gha-{0}-semgrep"]}}', github.run_id)) }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e EIO_BACKEND=posix \
            -e HTTP_PROXY -e HTTPS_PROXY -e http_proxy -e https_proxy \
            -e NO_PROXY -e no_proxy \
            -e REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Review the job log and JSON report."' semgrep.json


      - name: Retain Semgrep scan reports
        if: >-
          always() &&
          (hashFiles('semgrep.json') != '' || hashFiles('semgrep.sarif') != '') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-community-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: warn
          retention-days: 14
