# ng-runner-policy: github-hosted-default-v1
name: Trivy filesystem scan

run-name: action:${{ inputs.action }} pool:${{ inputs.runner_pool }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Requested operation
        required: true
        type: choice
        options:
          - trivy
      runner_pool:
        description: Runner pool for this operation
        required: true
        type: choice
        options: [github]
permissions:
  contents: read

concurrency:
  group: ng-scan-trivy-filesystem-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  trivy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'trivy' && inputs.runner_pool == 'github' && github.ref == 'refs/heads/main'
    name: Trivy source, dependency, and configuration scan
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest Trivy release
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # latest
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan applicable repository files
        run: ./scripts/security-scan-local.sh --trivy-only --ci
