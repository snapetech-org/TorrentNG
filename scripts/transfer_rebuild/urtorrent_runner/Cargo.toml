[package]
name = "torrentng-transfer-urtorrent-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
urtorrent = "=0.14.3"

[workspace]
resolver = "3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
