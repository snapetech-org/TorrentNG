# nosemgrep: generic.nginx.security.insecure-redirect.insecure-redirect -- YunoHost path normalization stays on the TLS-terminating front proxy.
#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

location __PATH__/ws {
    proxy_pass         http://127.0.0.1:__PORT__/ws;
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    proxy_set_header   Upgrade            "websocket";
    proxy_set_header   Connection         "upgrade";
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $remote_addr;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_read_timeout 86400;
}

location __PATH__/ {
    proxy_pass         http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $remote_addr;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_cookie_path  /                  "__PATH__/; SameSite=Lax";
    client_max_body_size 100M;
}
