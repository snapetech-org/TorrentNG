services:
  rtorrent:
    image: torrentng/rtorrent-benchmark:v0.16.28-0c23d27-lib392030e
    build:
      context: ../../certification/benchmarks/rtorrent-current
      dockerfile: Dockerfile
      args:
        DEBIAN_SNAPSHOT: 20261021T000000Z
        LIBTORRENT_VERSION: v0.16.28
        LIBTORRENT_COMMIT: 392030e0fddbe4e423d059d9322382cf44aaaaf6
        RTORRENT_VERSION: v0.16.28
        RTORRENT_COMMIT: 0c23d278a7838402d4cec9689bf71e051332be67
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/usr/local/bin/rtorrent"]
    command:
      - "-n"
      - "-o"
      - "import=/etc/rtorrent/rtorrent.rc"
      - "-o"
      - "system.daemon.set=true"
