services:
  rtorrent:
    image: torrentng/rtorrent-benchmark:v0.16.26-62899bd-lib21daa3b
    build:
      context: ../../certification/benchmarks/rtorrent-current
      dockerfile: Dockerfile
      args:
        DEBIAN_SNAPSHOT: 20261021T000000Z
        LIBTORRENT_VERSION: v0.16.26
        LIBTORRENT_COMMIT: 21daa3b96a3b8cfe14961545b5115de7ed12da95
        RTORRENT_VERSION: v0.16.26
        RTORRENT_COMMIT: 62899bd053c39b70380464e8f64dbcfce92579aa
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/usr/local/bin/rtorrent"]
    command:
      - "-n"
      - "-o"
      - "import=/etc/rtorrent/rtorrent.rc"
      - "-o"
      - "system.daemon.set=true"
