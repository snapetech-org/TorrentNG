name: torrentng-interop

x-interop-dns: &interop-dns
  dns:
    - "${INTEROP_DNS_PRIMARY:-1.1.1.1}"
    - "${INTEROP_DNS_SECONDARY:-8.8.8.8}"

services:
  torrentngd:
    <<: *interop-dns
    image: ${INTEROP_TORRENTNG_IMAGE:-torrentng/torrentngd:interop}
    build:
      context: ../..
      dockerfile: deploy/native/Dockerfile
      args:
        TORRENTNG_SOURCE_REVISION: ${INTEROP_SOURCE_REVISION:-unknown}
        TORRENTNG_SOURCE_FINGERPRINT: ${INTEROP_SOURCE_FINGERPRINT:-unknown}
        TORRENTNG_CARGO_FEATURES: ${INTEROP_TORRENTNG_CARGO_FEATURES:-system-allocator}
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${INTEROP_RUST_HOST_PORT:-28180}:8080"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_RUST_PEER_PORT:-29181}:6881"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_RUST_PEER_PORT:-29181}:6881/udp"
    volumes:
      - ${INTEROP_TORRENTNG_CONFIG:-./torrentngd.config.toml}:/etc/torrentngd/config.toml:ro
      - torrentngd-state:/var/lib/torrentngd
      - ${INTEROP_WORKDIR:-../../certification/interop}/downloads:/downloads
      - ${INTEROP_WORKDIR:-../../certification/interop}/artifacts:/artifacts
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TORRENTNGD_CONFIG: /etc/torrentngd/config.toml
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [interop]

  qbittorrent:
    <<: *interop-dns
    image: lscr.io/linuxserver/qbittorrent@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTEROP_QBIT_HOST_PORT:-28181}:8080"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_QBIT_PEER_PORT:-29182}:6882"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_QBIT_PEER_PORT:-29182}:6882/udp"
    volumes:
      - ${INTEROP_CONFIG_DIR:-${INTEROP_WORKDIR:-../../certification/interop}/config}/qbittorrent:/config
      - ${INTEROP_WORKDIR:-../../certification/interop}/downloads:/downloads
      - ${INTEROP_WORKDIR:-../../certification/interop}/artifacts:/artifacts
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6882"
      QBT_WEBUI_PORT: "8080"
    networks: [interop]

  transmission:
    <<: *interop-dns
    image: lscr.io/linuxserver/transmission@sha256:55aaeedf9fc354d34136387e15ee0ba4679096f20398dd2875867e5cd5cf8be5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTEROP_TRANSMISSION_HOST_PORT:-28191}:9091"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_TRANSMISSION_PEER_PORT:-29183}:51413"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_TRANSMISSION_PEER_PORT:-29183}:51413/udp"
    volumes:
      - ${INTEROP_CONFIG_DIR:-${INTEROP_WORKDIR:-../../certification/interop}/config}/transmission:/config
      - ${INTEROP_WORKDIR:-../../certification/interop}/downloads:/downloads
      - ${INTEROP_WORKDIR:-../../certification/interop}/artifacts:/artifacts
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      TRANSMISSION_WEB_HOME: /transmission-web-control/
      TRANSMISSION_RPC_AUTHENTICATION_REQUIRED: "false"
      TRANSMISSION_PEER_PORT: "51413"
    networks: [interop]

  deluge:
    <<: *interop-dns
    image: lscr.io/linuxserver/deluge@sha256:bf306ddd5e6d4a85d3d05ce1b947ab6e344e7fca1b7740b77c58ce170118c7ff
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTEROP_DELUGE_HOST_PORT:-28212}:8112"
      - "127.0.0.1:${INTEROP_DELUGE_DAEMON_PORT:-25889}:58846"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_DELUGE_PEER_PORT:-29184}:6884"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_DELUGE_PEER_PORT:-29184}:6884/udp"
    volumes:
      - ${INTEROP_CONFIG_DIR:-${INTEROP_WORKDIR:-../../certification/interop}/config}/deluge:/config
      - ${INTEROP_WORKDIR:-../../certification/interop}/downloads:/downloads
      - ${INTEROP_WORKDIR:-../../certification/interop}/artifacts:/artifacts
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      DELUGE_LOGLEVEL: info
    networks: [interop]

  rtorrent:
    <<: *interop-dns
    image: jesec/rtorrent@sha256:994728c59953e5f19c643827024dd06e9ffaf62b8d903a3f1468794415e72e03
    restart: unless-stopped
    command: ["-o", "system.daemon.set=true"]
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${INTEROP_RTORRENT_BIND_ADDR:-${INTEROP_BIND_ADDR:-127.0.0.1}}:${INTEROP_RTORRENT_PEER_PORT:-29185}:6885"
      - "${INTEROP_RTORRENT_BIND_ADDR:-${INTEROP_BIND_ADDR:-127.0.0.1}}:${INTEROP_RTORRENT_PEER_PORT:-29185}:6885/udp"
    volumes:
      - ${INTEROP_RTORRENT_CONFIG:-./rtorrent.rc}:/etc/rtorrent/rtorrent.rc:ro
      - ${INTEROP_CONFIG_DIR:-${INTEROP_WORKDIR:-../../certification/interop}/config}/rtorrent:/config
      - ${INTEROP_WORKDIR:-../../certification/interop}/watch/rtorrent:/watch
      - ${INTEROP_WORKDIR:-../../certification/interop}/downloads:/downloads
      - ${INTEROP_WORKDIR:-../../certification/interop}/artifacts:/artifacts
    environment:
      HOME: /config
      TERM: xterm
    networks: [interop]

  opentracker:
    image: lednerb/opentracker-docker@sha256:a055447e44450036b7b2a923618b12d4ecf1eff3c894e969cc2c42f466b2c6f6
    restart: unless-stopped
    command: ["opentracker", "-p", "6969", "-P", "6969"]
    ports:
      - "${INTEROP_TRACKER_BIND_ADDR:-127.0.0.1}:${INTEROP_TRACKER_HOST_PORT:-26969}:6969"
      - "${INTEROP_TRACKER_BIND_ADDR:-127.0.0.1}:${INTEROP_TRACKER_HOST_PORT:-26969}:6969/udp"
    networks: [interop]

  seed_leecher:
    <<: *interop-dns
    image: lscr.io/linuxserver/qbittorrent@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
    restart: "no"
    ports:
      - "127.0.0.1:${INTEROP_SEED_QBIT_HOST_PORT:-26801}:8080"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_SEED_QBIT_PEER_PORT:-29186}:6886"
      - "${INTEROP_CLIENT_BIND_ADDR:-0.0.0.0}:${INTEROP_SEED_QBIT_PEER_PORT:-29186}:6886/udp"
    volumes:
      - ${INTEROP_SEED_QBIT_CONFIG:-${INTEROP_CONFIG_DIR:-${INTEROP_WORKDIR:-../../certification/interop}/config}/qbittorrent-seed}:/config
      - ${INTEROP_SEED_QBIT_DOWNLOAD_DIR:-../../certification/interop/leecher}:/downloads
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6886"
      QBT_WEBUI_PORT: "8080"
    networks: [interop]

  fixture-http:
    image: nginx@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTEROP_FIXTURE_HTTP_PORT:-28188}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${INTEROP_WORKDIR:-../../certification/interop}/fixtures:/usr/share/nginx/html:ro
      - ${INTEROP_WORKDIR:-../../certification/interop}/artifacts:/artifacts:ro
    networks: [interop]

networks:
  interop:
    driver: bridge

volumes:
  torrentngd-state:
