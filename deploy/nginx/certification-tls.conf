log_format tng_redacted_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $tng_websocket_upgrade {
    default "";
    ~*^websocket$ websocket;
}

map $tng_websocket_upgrade $tng_websocket_connection {
    default close;
    websocket upgrade;
}

server {
    listen 443 ssl;
    server_name localhost torrentng-cert-tls;
    access_log /dev/stdout tng_redacted_access;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location /ws {
        proxy_pass         http://torrentng:8080;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- the maps above only allow websocket; other Upgrade values are omitted and the connection closes
        proxy_set_header   Upgrade    $tng_websocket_upgrade;
        proxy_set_header   Connection $tng_websocket_connection;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Remote-User "";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://torrentng:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Remote-User     "";
        proxy_read_timeout 60s;
    }
}
