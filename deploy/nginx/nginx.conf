log_format tng_redacted_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout tng_redacted_access;

    # WebUI static assets
    location / {
        proxy_pass         http://torrentng:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Remote-User    "";
    }

    # API
    location /api/ {
        proxy_pass         http://torrentng:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Remote-User    "";
        proxy_read_timeout 60s;
    }

    # WebSocket events
    location /ws {
        proxy_pass         http://torrentng:8080;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    "websocket";
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Remote-User "";
        proxy_read_timeout 3600s;
    }
}
